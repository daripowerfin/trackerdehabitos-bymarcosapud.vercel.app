<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Informe Técnico De Implementación - Tracker De Hábitos - By Marcos Apud</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080e1c;color:#e2e8f0;font-family:'Geist',Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
.container{max-width:520px;width:100%;text-align:center}
.logo-wrap{width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,#00B9C8 25%,#00BC88 75%);display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.logo-wrap svg{width:42px;height:42px;stroke:white;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:20px;font-weight:800;color:#f1f5f9;margin-bottom:6px}
.sub{font-size:13px;color:#475569;margin-bottom:28px}
.badge-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:28px}
.badge{background:rgba(0,185,200,.08);border:1px solid rgba(0,185,200,.2);border-radius:8px;padding:5px 12px;font-size:11px;font-weight:600;color:#00B9C8}
.btn{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(135deg,#00B9C8,#00BC88);color:white;border:none;border-radius:12px;padding:14px 28px;font-size:15px;font-weight:700;font-family:'Geist',sans-serif;cursor:pointer}
.btn svg{width:18px;height:18px;stroke:white;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.status{margin-top:14px;font-size:13px;color:#475569;min-height:18px}
.progress{width:100%;height:3px;background:rgba(51,65,85,.4);border-radius:2px;margin-top:10px;overflow:hidden;display:none}
.progress-fill{height:100%;background:linear-gradient(90deg,#00B9C8,#00BC88);border-radius:2px;transition:width .3s;width:0%}
</style>
</head>
<body>
<div class="container">
  <div class="logo-wrap"><svg viewBox="0 0 24 24"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg></div>
  <h1>Informe Técnico De Implementación</h1>
  <div class="sub">Tracker De Hábitos - By Marcos Apud</div>
  <div class="badge-row">
    <span class="badge">4 páginas</span><span class="badge">Mayo 2026</span><span class="badge">Uso interno</span>
  </div>
  <button class="btn" onclick="downloadReport()">
    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Descargar Informe PDF
  </button>
  <div class="status" id="status"></div>
  <div class="progress" id="progress"><div class="progress-fill" id="pfill"></div></div>
</div>
<script>
const BG='#080e1c',CY='#00B9C8',GR='#00BC88',TXT='#e2e8f0',SEC='#94a3b8',DIM='#475569',BORDER='rgba(0,185,200,.18)';

function sp(pct,msg){document.getElementById('pfill').style.width=pct+'%';document.getElementById('status').textContent=msg;document.getElementById('progress').style.display='block';}

function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();}

function drawBG(ctx,W,H){
  ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);
  function blob(x,y,r,c){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
  blob(W*.1,H*.2,W*.48,'rgba(0,185,200,.13)');blob(W*.88,H*.6,W*.42,'rgba(46,168,204,.10)');blob(W*.5,H*.87,W*.38,'rgba(0,188,136,.09)');
  ctx.save();ctx.globalAlpha=0.09;
  const dcx=W*.87,da=52,df=1/115;
  for(const s of[-1,1]){ctx.beginPath();ctx.strokeStyle=s>0?CY:GR;ctx.lineWidth=2.5;for(let py=60;py<H-60;py+=3){const px=dcx+s*da*Math.sin(py*df*Math.PI*2);py===60?ctx.moveTo(px,py):ctx.lineTo(px,py);}ctx.stroke();}
  ctx.strokeStyle='rgba(0,185,200,.5)';ctx.lineWidth=1.2;
  for(let py=60;py<H-60;py+=32){const x1=dcx+da*Math.sin(py*df*Math.PI*2),x2=dcx-da*Math.sin(py*df*Math.PI*2);ctx.beginPath();ctx.moveTo(x1,py);ctx.lineTo(x2,py);ctx.stroke();}
  ctx.globalAlpha=0.035;ctx.strokeStyle=CY;ctx.lineWidth=1;
  for(let row=-1;row<H/52+1;row++){for(let col=-1;col<W/46+1;col++){
    const ox=col*46+(row%2)*23,oy=row*52;
    ctx.beginPath();for(let a=0;a<6;a++){const ax=ox+18*Math.cos(Math.PI/3*a-Math.PI/6),ay=oy+18*Math.sin(Math.PI/3*a-Math.PI/6);a===0?ctx.moveTo(ax,ay):ctx.lineTo(ax,ay);}ctx.closePath();ctx.stroke();
  }}
  ctx.restore();
}

function drawLogo(ctx,cx,cy,size){
  const s=size,r=Math.round(14/56*s),lx=cx-s/2,ly=cy-s/2;
  const lg=ctx.createLinearGradient(lx,ly,lx+s,ly+s);lg.addColorStop(.25,CY);lg.addColorStop(.75,GR);
  ctx.fillStyle=lg;rr(ctx,lx,ly,s,s,r);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=1.5;rr(ctx,lx,ly,s,s,r);ctx.stroke();
  const io=Math.round(8/56*s),is2=Math.round(40/56*s),sc=is2/24;
  ctx.save();ctx.translate(lx+io,ly+io);ctx.scale(sc,sc);
  ctx.strokeStyle='white';ctx.lineWidth=2/sc;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.stroke(new Path2D('M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z'));
  ctx.restore();
}

function pageHdr(ctx,W,pageNum,total){
  const H2=72; // taller header
  const hg=ctx.createLinearGradient(0,0,W,0);hg.addColorStop(0,'#1e8aad');hg.addColorStop(1,'#0d4a60');
  ctx.fillStyle=hg;ctx.fillRect(0,0,W,H2);
  // Fade at bottom
  const fb=ctx.createLinearGradient(0,H2-20,0,H2);fb.addColorStop(0,'rgba(8,14,28,0)');fb.addColorStop(1,BG);
  ctx.fillStyle=fb;ctx.fillRect(0,H2-20,W,20);
  // Logo centered vertically
  drawLogo(ctx,46,H2/2-9,40);
  // App name and subtitle — vertically centered
  ctx.fillStyle='white';ctx.font='bold 16px Arial';ctx.textAlign='left';
  ctx.fillText('Tracker de Hábitos Biohacker',96,H2/2-6);
  ctx.fillStyle='rgba(255,255,255,.52)';ctx.font='13px Arial';
  ctx.fillText('Informe Técnico de Implementación  ·  by Marcos Apud',96,H2/2+13);
  // Page number right-aligned, centered
  ctx.fillStyle='rgba(255,255,255,.42)';ctx.font='bold 14px Arial';ctx.textAlign='right';
  ctx.fillText('Pág. '+pageNum+' / '+total,W-36,H2/2+6);ctx.textAlign='left';
  return H2+52; // generous gap after header before content
}

function pgFooter(ctx,W,H){
  const ftg=ctx.createLinearGradient(0,H-50,0,H);ftg.addColorStop(0,'rgba(8,14,28,0)');ftg.addColorStop(0.5,'rgba(8,14,28,.8)');ftg.addColorStop(1,'rgba(8,14,28,1)');
  ctx.fillStyle=ftg;ctx.fillRect(0,H-50,W,50);
  ctx.fillStyle='rgba(255,255,255,.3)';ctx.font='12px Arial';ctx.textAlign='left';
  ctx.fillText('Tracker de Hábitos Biohacker  ·  Informe Técnico  ·  by Marcos Apud',36,H-14);
  ctx.textAlign='left';
}

function secHdr(ctx,W,n,title,y){
  ctx.textAlign='left';
  const baseline=y+22;
  ctx.fillStyle=CY;ctx.font='bold 12px Arial';
  ctx.fillText('0'+n,36,baseline);
  ctx.fillStyle=TXT;ctx.font='bold 28px Arial';
  ctx.fillText(title,36+34,baseline);
  const tw=36+34+ctx.measureText(title).width+12;
  const lg=ctx.createLinearGradient(tw,0,W-40,0);lg.addColorStop(0,'rgba(0,185,200,.3)');lg.addColorStop(1,'rgba(0,185,200,0)');
  ctx.strokeStyle=lg;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(tw,baseline-8);ctx.lineTo(W-40,baseline-8);ctx.stroke();
  return y+44;
}

// Table with text wrapping — no truncation
function drawTable(ctx,x,y,colDefs,headers,rows){
  // colDefs: array of {w, align?}
  const W_total=colDefs.reduce((s,c)=>s+c.w,0);
  const FONT_H=14,FONT_B=14,PAD=10,LINE=18;

  function measureRows(ctx,rows,colDefs){
    return rows.map(row=>({
      row,
      heights:row.map((cell,ci)=>{
        const maxW=colDefs[ci].w-PAD*2;
        if(cell==='✓'||cell==='–')return 1;
        ctx.font=(ci===0?'bold ':'')+''+FONT_H+'px Arial';
        const words=cell.split(' ');let line='',lines=1;
        words.forEach(w=>{const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){lines++;line=w;}else line=t;});
        return lines;
      }),
    }));
  }

  function drawCell(ctx,text,x,y,maxW,bold,rowH){
    if(text==='✓'){ctx.fillStyle=GR;ctx.font='bold 16px Arial';ctx.fillText('✓',x+PAD,y+rowH/2+5);return;}
    if(text==='–'){ctx.fillStyle=DIM;ctx.font='14px Arial';ctx.fillText('–',x+PAD,y+rowH/2+5);return;}
    ctx.font=(bold?'bold ':'')+FONT_H+'px Arial';
    ctx.fillStyle=bold?SEC:TXT;
    const words=text.split(' ');let line='',lines=[];
    words.forEach(w=>{const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w;}else line=t;});
    if(line)lines.push(line);
    const totalH=lines.length*LINE;
    const startY=y+(rowH-totalH)/2+LINE-3;
    lines.forEach((l,i)=>ctx.fillText(l,x+PAD,startY+i*LINE));
  }

  const measured=measureRows(ctx,rows,colDefs);
  const rowHeights=measured.map(({heights})=>Math.max(36,Math.max(...heights)*LINE+PAD*2));

  // Header row
  const HDR_H=40;
  ctx.fillStyle='rgba(0,185,200,.12)';rr(ctx,x,y,W_total,HDR_H,6);ctx.fill();
  ctx.strokeStyle=BORDER;ctx.lineWidth=1;rr(ctx,x,y,W_total,HDR_H,6);ctx.stroke();
  let cx=x;
  headers.forEach((h,i)=>{ctx.fillStyle=CY;ctx.font='bold '+FONT_B+'px Arial';ctx.fillText(h,cx+PAD,y+HDR_H/2+5);cx+=colDefs[i].w;});

  // Data rows
  let cy=y+HDR_H;
  rows.forEach((row,ri)=>{
    const rh=rowHeights[ri];
    ctx.fillStyle=ri%2===0?'rgba(15,28,50,.75)':'rgba(15,28,50,.38)';
    rr(ctx,x,cy,W_total,rh,0);ctx.fill();
    ctx.strokeStyle='rgba(51,65,85,.22)';ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(x,cy);ctx.lineTo(x+W_total,cy);ctx.stroke();
    cx=x;
    row.forEach((cell,ci)=>{drawCell(ctx,cell,cx,cy,colDefs[ci].w-PAD*2,ci===0,rh);cx+=colDefs[ci].w;});
    cy+=rh;
  });
  ctx.strokeStyle=BORDER;ctx.lineWidth=1;rr(ctx,x,y,W_total,cy-y,6);ctx.stroke();
  return cy+14;
}

// ─── PAGE 1 COVER ────────────────────────────────────────────────
function drawCover(ctx,W,H){
  drawBG(ctx,W,H);
  ctx.fillStyle=CY;ctx.fillRect(0,0,W,3);

  // Measure badge widths dynamically
  ctx.font='bold 20px Arial';
  const metas=[['TIPO','Doc. Técnico Interno'],['VERSIÓN','V4'],['FECHA','15/05/2026']];
  const gap=14;
  const badges=metas.map(([lbl,val])=>{const vw=ctx.measureText(val).width;return{lbl,val,w:Math.max(140,vw+48)};});
  const totalBW=badges.reduce((s,b)=>s+b.w,0)+(badges.length-1)*gap;

  // Layout — well-distributed vertically
  let cy=H*0.20; // start higher so content doesn't cluster in center

  // Eyebrow first (top area)
  ctx.fillStyle='rgba(0,185,200,.7)';ctx.font='bold 11px Arial';ctx.letterSpacing='0.12em';
  ctx.textAlign='center';ctx.fillText('INFORME TÉCNICO DE IMPLEMENTACIÓN',W/2,cy);cy+=20;
  // Thin divider
  const dg=ctx.createLinearGradient(W*.3,0,W*.7,0);dg.addColorStop(0,'rgba(0,185,200,0)');dg.addColorStop(.5,'rgba(0,185,200,.5)');dg.addColorStop(1,'rgba(0,185,200,0)');
  ctx.strokeStyle=dg;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(W*.25,cy);ctx.lineTo(W*.75,cy);ctx.stroke();cy+=36;

  // Logo — centered in its own space
  drawLogo(ctx,W/2,cy+52,106) /* logo center at cy+52 */;cy+=168;

  // Title — raised 0.5cm from previous
  cy+=20;
  ctx.fillStyle='#f1f5f9';ctx.font='bold 50px Arial';ctx.fillText('Tracker de Hábitos',W/2,cy);cy+=58;
  ctx.fillStyle=CY;ctx.font='bold 50px Arial';ctx.fillText('Biohacker',W/2,cy);cy+=44;
  ctx.fillStyle='rgba(255,255,255,.38)';ctx.font='19px Arial';ctx.fillText('V4  ·  Mayo 2026  ·  by Marcos Apud',W/2,cy);cy+=56;

  // Badges — properly sized
  let bx=W/2-totalBW/2;
  badges.forEach(({lbl,val,w})=>{
    const BH=78;const PAD=24; // padding from edges
    ctx.textAlign='center';
    rr(ctx,bx,cy,w,BH,12);ctx.fillStyle='rgba(0,185,200,.09)';ctx.fill();
    ctx.strokeStyle=BORDER;ctx.lineWidth=1;rr(ctx,bx,cy,w,BH,12);ctx.stroke();
    // Label — same small font all badges
    ctx.fillStyle=CY;ctx.font='bold 11px Arial';
    ctx.fillText(lbl,bx+w/2,cy+22);
    // Value — same font size for ALL badges (17px bold), clipped to badge width
    ctx.fillStyle=TXT;ctx.font='bold 17px Arial';
    // Ensure text fits within badge (with padding)
    ctx.save();ctx.rect(bx+PAD,cy,w-PAD*2,BH);ctx.clip();
    ctx.fillText(val,bx+w/2,cy+56);
    ctx.restore();
    bx+=w+gap;
  });
  ctx.textAlign='left';

  ctx.fillStyle=CY;ctx.fillRect(0,H-3,W,3);
  ctx.fillStyle='rgba(255,255,255,.2)';ctx.font='13px Arial';ctx.textAlign='left';
  ctx.fillText('Documento de uso interno  ·  Distribución restringida al equipo',36,H-16);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,.4)';ctx.font='bold 13px Arial';ctx.fillText('by Marcos Apud',W-36,H-16);
  ctx.textAlign='left';
}

// ─── PAGE 2 ───────────────────────────────────────────────────────
function drawPage2(ctx,W,H){
  drawBG(ctx,W,H);
  const TW=W-72; // defined here so all sections can use it
  let y=pageHdr(ctx,W,2,4);

  y=secHdr(ctx,W,1,'RESUMEN EJECUTIVO',y);y+=12;
  // Full-width word-wrap
  const paraText='El presente documento describe la implementación técnica del Tracker de Hábitos Biohacker V4, una aplicación web standalone (HTML5 + CSS3 + JavaScript puro) sin dependencias externas, alojada en Netlify bajo dominio personalizado. La aplicación fue migrada y rediseñada completamente desde la versión original, incorporando gamificación, generación de PDF via Canvas API, música binaural generativa, notificaciones push y un motor de compartir multi-canal (PDF / WhatsApp / Link).';
  ctx.fillStyle='rgba(203,213,225,.82)';ctx.font='17px Arial';
  const paraWords=paraText.split(' '),paraMaxW=TW-4;
  let paraLine='';
  paraWords.forEach(w=>{const t=paraLine?paraLine+' '+w:w;if(ctx.measureText(t).width>paraMaxW&&paraLine){ctx.fillText(paraLine,36,y);y+=24;paraLine=w;}else paraLine=t;});
  if(paraLine){ctx.fillText(paraLine,36,y);y+=24;}
  y+=22;

  y=secHdr(ctx,W,2,'ARQUITECTURA TÉCNICA',y);y+=12;
  const c1=200,c2=200,c3=TW-c1-c2;
  y=drawTable(ctx,36,y,
    [{w:c1},{w:c2},{w:c3}],
    ['Tecnología','Uso principal','Notas'],
    [
      ['HTML5 / CSS3','Estructura, layout, animaciones','Sin framework UI. CSS custom properties.'],
      ['JavaScript ES2022','Lógica, estado, renderizado','Vanilla JS. Cero dependencias npm.'],
      ['Web Audio API','Música binaural generativa','Oscilladores inline. 100% offline.'],
      ['Canvas API 2D','Generación de PDF inline','Sin jsPDF ni CDN externos. JPEG → PDF.'],
      ['Notifications API','Recordatorios push diarios','Service Worker local. HTTPS requerido.'],
      ['localStorage / sessionStorage','Persistencia del estado','Migración automática v3 → V4.'],
      ['Netlify (static hosting)','CDN + HTTPS + deploy','trackerdehabitos-bymarcosapud.netlify.app'],
    ]
  );y+=12;

  y=secHdr(ctx,W,3,'ALOJAMIENTO Y ACCESO',y);y+=12;
  ctx.fillStyle='rgba(15,28,50,.9)';rr(ctx,36,y,TW,72,10);ctx.fill();
  ctx.strokeStyle=BORDER;ctx.lineWidth=1;rr(ctx,36,y,TW,72,10);ctx.stroke();
  ctx.fillStyle=CY;ctx.font='bold 15px Arial';ctx.fillText('URL de producción:',52,y+26);
  ctx.fillStyle=GR;ctx.font='bold 17px Arial';ctx.fillText('https://trackerdehabitos-bymarcosapud.netlify.app',52,y+52);
  y+=88;

  // ── SECCIÓN DESTACADA: CERO FRICCIÓN ───────────────────────
  y=secHdr(ctx,W,4,'SIN INICIO DE SESIÓN',y);y+=12;
  // Big highlight card
  const gradFric=ctx.createLinearGradient(36,y,TW+36,y+180);
  gradFric.addColorStop(0,'rgba(0,185,200,.12)');gradFric.addColorStop(1,'rgba(0,188,136,.06)');
  ctx.fillStyle=gradFric;rr(ctx,36,y,TW,180,14);ctx.fill();
  ctx.strokeStyle='rgba(0,185,200,.3)';ctx.lineWidth=1.5;rr(ctx,36,y,TW,180,14);ctx.stroke();
  // Icon row
  const icons=['🔓','⚡','📲'];const iconLabels=['Sin registro','Sin contraseña','Acceso inmediato'];
  const iw=TW/3;
  icons.forEach((icon,i)=>{
    const ix=36+i*iw+iw/2;
    ctx.fillStyle=TXT;ctx.font='28px Arial';ctx.textAlign='center';ctx.fillText(icon,ix,y+44);
    ctx.fillStyle=CY;ctx.font='bold 14px Arial';ctx.fillText(iconLabels[i],ix,y+68);
  });
  ctx.textAlign='left';
  // Description text
  // Full-width word-wrap for friction section
  ctx.fillStyle='rgba(203,213,225,.82)';ctx.font='16px Arial';
  const fricText='El usuario abre la app y comienza a usar inmediatamente — sin crear cuenta, sin email, sin contraseña y sin ningún tipo de verificación. Cero fricción de entrada. Los datos se guardan localmente en el dispositivo (localStorage) sin pasar por ningún servidor. La privacidad es total: ningún dato personal sale del dispositivo sin consentimiento explícito del usuario.';
  const fricWords=fricText.split(' '),fricMaxW=TW-36;
  let fricLine='',fricY=y+96;
  fricWords.forEach(w=>{const t=fricLine?fricLine+' '+w:w;if(ctx.measureText(t).width>fricMaxW&&fricLine){ctx.fillText(fricLine,52,fricY);fricY+=22;fricLine=w;}else fricLine=t;});
  if(fricLine){ctx.fillText(fricLine,52,fricY);fricY+=22;}
  y+=194;

  pgFooter(ctx,W,H);
}

// ─── PAGE 3 ───────────────────────────────────────────────────────
function drawPage3(ctx,W,H){
  drawBG(ctx,W,H);
  let y=pageHdr(ctx,W,3,4);
  y=secHdr(ctx,W,5,'FUNCIONALIDADES IMPLEMENTADAS',y);y+=12;
  const TW=W-72;
  const c1n=42,c1m=160,c1d=TW-c1n-c1m-54,c1ok=54;
  y=drawTable(ctx,36,y,
    [{w:c1n},{w:c1m},{w:c1d},{w:c1ok}],
    ['#','Módulo','Descripción','OK'],
    [
      ['★','Sin Inicio de Sesión','Acceso inmediato sin registro, cuenta ni contraseña. Cero fricción.','✓'],
      ['01','Onboarding Interactivo','4 slides con iconos SVG premium, sistema de dots y progreso','✓'],
      ['02','Motor de Hábitos','25 hábitos biohacker + 6 finanzas + personalizados. 9 categorías','✓'],
      ['03','Sistema de Gamificación','10 niveles, 12 medallas SVG, puntos por hábito + bonus categoría','✓'],
      ['04','Música Binaural Generativa','432Hz + 439Hz inline (Web Audio API). Fade-in sincronizado con UI','✓'],
      ['05','Animaciones de Fondo','4 nubes animadas con movimiento orgánico. Glassmorphism en nav','✓'],
      ['06','Confetti Posicional','Confetti desde coordenadas exactas del toque/click del usuario','✓'],
      ['07','Toasts Premium SVG','Toasts con iconos SVG para categoría, nivel (10) y medalla (12)','✓'],
      ['08','240 Mensajes Motivacionales','3 estados (bajo/medio/alto), anti-repetición, personalización','✓'],
      ['09','PDF Inline sin CDN','Canvas API → JPEG → PDF binario. Branding Marcos Apud completo','✓'],
      ['10','Compartir WhatsApp','Resumen formateado con emojis. Abre WhatsApp directo','✓'],
      ['11','Compartir Link','URL con datos base64 vía Netlify. Vista read-only para receptor','✓'],

// ─── PDF BUILDER ──────────────────────────────────────────────────
async function buildMultiPagePDF(canvases,PW,PH){
  const E=new TextEncoder();
  const jpegs=await Promise.all(canvases.map(cv=>new Promise(res=>cv.toBlob(res,'image/jpeg',.93)).then(b=>b.arrayBuffer()).then(buf=>({d:new Uint8Array(buf),w:cv.width,h:cv.height}))));
  const N=jpegs.length;const kids=jpegs.map((_,i)=>(3+i*3)+' 0 R').join(' ');
  const segs=[];const offsets=[];let off=0;
  function txt(s){const b=E.encode(s);segs.push(b);off+=b.length;}
  function mark(s){offsets.push(off);txt(s);}
  txt('%PDF-1.4\n');mark(`1 0 obj\n<</Type/Catalog/Pages 2 0 R>>\nendobj\n`);
  mark(`2 0 obj\n<</Type/Pages/Kids[${kids}]/Count ${N}>>\nendobj\n`);
  jpegs.forEach(({d,w,h},i)=>{
    const pn=3+i*3,cn=4+i*3,im=5+i*3,cs=`q ${PW} 0 0 ${PH} 0 0 cm /Im${i} Do Q\n`;
    mark(`${pn} 0 obj\n<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${PW} ${PH}]/Resources<</XObject<</Im${i} ${im} 0 R>>>>/Contents ${cn} 0 R>>\nendobj\n`);
    mark(`${cn} 0 obj\n<</Length ${E.encode(cs).length}>>\nstream\n${cs}endstream\nendobj\n`);
    const imH=`${im} 0 obj\n<</Type/XObject/Subtype/Image/Width ${w}/Height ${h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${d.length}>>\nstream\n`;
    offsets.push(off);const bh=E.encode(imH);segs.push(bh);off+=bh.length;segs.push(d);off+=d.length;const bf=E.encode('\nendstream\nendobj\n');segs.push(bf);off+=bf.length;
  });
  const xp=off,numO=2+N*3,fmt=n=>String(n).padStart(10,'0');
  let xref=`xref\n0 ${numO+1}\n0000000000 65535 f \n`;offsets.forEach(o=>xref+=fmt(o)+' 00000 n \n');
  txt(xref+`trailer\n<</Size ${numO+1}/Root 1 0 R>>\nstartxref\n${xp}\n%%EOF`);
  const total=segs.reduce((s,b)=>s+b.length,0);const out=new Uint8Array(total);let p=0;
  segs.forEach(s=>{out.set(s,p);p+=s.length;});return out;
}

async function downloadReport(){
  const btn=document.querySelector('.btn');btn.disabled=true;btn.style.opacity='.6';
  sp(5,'Preparando...');
  const W=1190,H=1684;
  const fns=[drawCover,drawPage2,drawPage3,drawPage4];const canvases=[];
  for(let i=0;i<fns.length;i++){
    sp(10+i*20,'Renderizando página '+(i+1)+' de 4...');
    await new Promise(r=>setTimeout(r,20));
    const cv=document.createElement('canvas');cv.width=W;cv.height=H;
    fns[i](cv.getContext('2d'),W,H);canvases.push(cv);
  }
  sp(90,'Generando PDF...');await new Promise(r=>setTimeout(r,20));
  const pdfBytes=await buildMultiPagePDF(canvases,595,842);
  sp(97,'Descargando...');
  const blob=new Blob([pdfBytes],{type:'application/pdf'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='Informe-Tecnico-TrackerHabitos-V4-MarcosApud.pdf';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>{window.open(url,'_blank')||(window.location.href=url);setTimeout(()=>URL.revokeObjectURL(url),30000);},800);
  sp(100,'✓ Descargado');btn.disabled=false;btn.style.opacity='1';
  setTimeout(()=>{document.getElementById('progress').style.display='none';document.getElementById('status').textContent='';},3000);
}
